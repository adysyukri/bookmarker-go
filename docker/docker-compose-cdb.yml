version: "3.8"

services:
  cockroach1:
    image: cockroachdb/cockroach:v24.1.3
    container_name: cockroach1
    command: start --insecure --advertise-addr=cockroach1:26357 --http-addr=cockroach1:8080 --listen-addr=cockroach1:26357 --sql-addr=cockroach1:26257 --join=cockroach1:26357,cockroach2:26357,cockroach3:26357
    ports:
      - "26257:26257" # SQL port
      - "8080:8080" # Admin UI port
    volumes:
      - cockroach-data1:/cockroach/cockroach-data
    networks:
      - cockroach-network

  cockroach2:
    image: cockroachdb/cockroach:v24.1.3
    container_name: cockroach2
    command: start --insecure --advertise-addr=cockroach2:26357 --http-addr=cockroach2:8080 --listen-addr=cockroach2:26357 --sql-addr=cockroach2:26258 --join=cockroach1:26357,cockroach2:26357,cockroach3:26357
    ports:
      - "26258:26258" # SQL port for node 2
      - "8081:8080" # Admin UI port for node 2
    volumes:
      - cockroach-data2:/cockroach/cockroach-data
    networks:
      - cockroach-network

  cockroach3:
    image: cockroachdb/cockroach:v24.1.3
    container_name: cockroach3
    command: start --insecure --advertise-addr=cockroach3:26357 --http-addr=cockroach3:8080 --listen-addr=cockroach3:26357 --sql-addr=cockroach3:26259 --join=cockroach1:26357,cockroach2:26357,cockroach3:26357
    ports:
      - "26259:26259" # SQL port for node 3
      - "8082:8080" # Admin UI port for node 3
    volumes:
      - cockroach-data3:/cockroach/cockroach-data
    networks:
      - cockroach-network

volumes:
  cockroach-data1:
  cockroach-data2:
  cockroach-data3:

networks:
  cockroach-network:
